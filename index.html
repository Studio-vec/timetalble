<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Conference Timetable (A3)</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

    <div class="controls no-print">
        <div class="lang-buttons">
            <button id="btn-ko" class="active">KOR</button>
            <button id="btn-en">ENG</button>
        </div>
        <button id="download-pdf-btn">PDF 다운로드 (A3 가로)</button>
    </div>

    <div id="timetable-content">
        <div class="content-header">
            <div class="brand-left" id="brand-left">제27회 세계지식포럼</div>
            <h1 class="main-title">SESSIONS TIMETABLE</h1>
            <div class="brand-right" id="brand-right">프로메테우스의 순간</div>
        </div>
        <div id="timetable-wrapper">
            </div>
        <div class="footer-note no-export-skip">
            <div class="booksigning-label" id="booksigning-label">BOOK SIGNING</div>
            <table class="booksigning-table" id="booksigning-table">
                <colgroup>
                    <col class="col-speaker"><col class="col-book"><col class="col-time"><col class="col-place">
                </colgroup>
                <thead><tr id="booksigning-head"></tr></thead>
                <tbody id="booksigning-body"></tbody>
            </table>
            <div class="footer-bottom-row">
                <div class="footer-text" id="footer-text">*프로그램 및 시간표는 주최측 사정에 따라 변동될 수 있습니다.</div>
                <img class="footer-qr" id="footer-qr" src="qr-session.png" alt="QR: wkforum.org/session">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
